name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only Windows needs the LFS-tracked libmpv-2.dll - Linux/macOS get libmpv from apt/brew instead.
          lfs: ${{ matrix.platform == 'windows-latest' }}

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libmpv-dev

      - name: install mpv (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv
          # Copied so install_name_tool can rewrite its ID to @rpath (brew's own copy has an absolute path baked in) - build.rs links against this fixed copy, not brew's.
          mkdir -p src-tauri/native-libs/mpv-macos-runtime
          dylib=$(find "$(brew --prefix mpv)/lib" -name 'libmpv*.dylib' ! -type l | head -n1)
          cp "$dylib" src-tauri/native-libs/mpv-macos-runtime/libmpv.dylib
          install_name_tool -id @rpath/libmpv.dylib src-tauri/native-libs/mpv-macos-runtime/libmpv.dylib

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'StreamFlow ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
